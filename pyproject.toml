[project]
name = "sabeval"
version = "0.1.0"
description = "Reproduction code for 'Do LLMs Know Tool Irrelevance? Demystifying Structural Alignment Bias in Tool Invocations' (ACL 2026)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # core modeling / interpretability
    "torch>=2.5.1",
    "numpy<2.0.0",
    "transformers",
    "transformer-lens>=2.16.1",
    "einops",
    "jaxtyping",
    "protobuf",
    # data + plotting
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "python-dotenv",
    # notebooks
    "jupyter",
    "notebook",
    "ipykernel",
    "pyzmq<26",
]

[tool.uv]
override-dependencies = [
    "sentencepiece<0.2.1",
    "pyarrow<21.0.0",
    "torch>=2.5.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
